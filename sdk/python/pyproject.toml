[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "paytrust"
version = "0.1.0"
description = "PayTrust client and MCP server: payment authorization for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sanskar1724" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3", "anyio>=4.9"]
test = ["pytest>=8.2"]

[project.scripts]
paytrust-mcp = "paytrust.mcp_server:main"

[project.urls]
Repository = "https://github.com/Sanskar1724/PayTrust_AI"

[tool.hatch.build.targets.wheel]
packages = ["src/paytrust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-p no:asyncio"  # tests drive async code with anyio.run

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
