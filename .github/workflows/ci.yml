name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paytrust
          POSTGRES_PASSWORD: paytrust
          POSTGRES_DB: paytrust_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paytrust" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://paytrust:paytrust@localhost:5432/paytrust_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Migrations match models
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://paytrust:paytrust@localhost:5432/paytrust_test
        run: alembic upgrade head && alembic check && alembic downgrade base
      - run: pytest --cov=app --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t paytrust-ai:ci .
      - name: Smoke test
        run: |
          docker run -d --name pt -p 8000:8000 -e SECRET_KEY=ci-secret-0123456789abcdef0123456789 paytrust-ai:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/ready && break; sleep 2; done
          curl -sf localhost:8000/ready
          curl -sf localhost:8000/ | grep -q "PayTrust AI"
          docker logs pt | tail -20
