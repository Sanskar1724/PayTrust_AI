name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile app.py api/main.py models/threshold.py models/predict_ieee.py models/ml_risk.py
      - name: Test suite
        run: python -m pytest tests/ -q --tb=short
      - name: Threshold tool smoke (real IEEE held-out test, no network)
        run: python -m models.threshold
