[alembic]
script_location = alembic
# Put backend/ on sys.path so env.py can import the app package with the plain `alembic`
# command (CI, containers), not only with `python -m alembic`.
prepend_sys_path = .
# The database URL comes from app settings (DATABASE_URL), see alembic/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
