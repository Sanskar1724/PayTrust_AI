# Production-like local stack: PostgreSQL + Redis + PayTrust (API and console on one port).
#
#   cp .env.example .env        # then edit secrets
#   docker compose up --build
#   → http://localhost:8000      console
#   → http://localhost:8000/docs API reference

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paytrust
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paytrust}
      POSTGRES_DB: paytrust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paytrust -d paytrust"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: paytrust-ai:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://paytrust:${POSTGRES_PASSWORD:-paytrust}@postgres:5432/paytrust
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
